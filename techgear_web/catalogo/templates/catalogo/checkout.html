
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout - TechGear</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f1f3f5;color:#252525}
header{background:#fff;border-bottom:3px solid #e21b23;padding:20px 45px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 15px rgba(0,0,0,.1);position:relative}
header:after{content:"";position:absolute;bottom:-3px;left:45px;width:120px;height:3px;background:#ff3038}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:38px;height:38px;border:2px solid #e21b23;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#e21b23;font-weight:bold;font-size:20px}
header h1{margin:0;color:#df1d25;font-size:28px;letter-spacing:2px}
header p{margin:4px 0 0;color:#777;font-size:12px;letter-spacing:2px}
.volver{background:#fff;color:#e21b23;border:1px solid #e21b23;padding:10px 18px;border-radius:5px;text-decoration:none;font-weight:bold;transition:.2s}
.volver:hover{background:#e21b23;color:#fff}
.contenedor{max-width:600px;margin:45px auto;padding:0 20px}
.checkout{background:#fff;border:1px solid #ddd;border-top:4px solid #e21b23;border-radius:8px;padding:32px;box-shadow:0 5px 18px rgba(0,0,0,.09)}
.etiqueta{color:#999;font-size:10px;letter-spacing:2px;text-align:center;margin-bottom:6px}
h2{margin:0 0 25px;color:#222;text-align:center;font-size:25px}
h2 span{color:#e21b23}
label{display:block;color:#444;font-weight:bold;margin:15px 0 7px}
input{width:100%;background:#fafafa;color:#333;border:1px solid #ccc;border-radius:5px;padding:11px;font-family:Arial;font-size:15px;outline:none;transition:.2s}
input:focus{background:#fff;border-color:#e21b23;box-shadow:0 0 7px rgba(226,27,35,.18)}
.boton{width:100%;margin-top:25px;background:#e21b23;color:#fff;border:0;border-radius:5px;padding:13px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s}
.boton:hover{background:#bd1118;box-shadow:0 0 10px rgba(226,27,35,.3)}
.mensaje{background:#effaf0;color:#267326;border:1px solid #a8d8a8;border-radius:5px;padding:12px;margin-bottom:20px;text-align:center}
@media(max-width:650px){
header{padding:20px;flex-direction:column;gap:18px;text-align:center}
header:after{left:50%;transform:translateX(-50%)}
.contenedor{margin:30px auto}
}
</style>
</head>
<body>

<header>
<div class="logo">
<div class="logo-icon">TG</div>
<div>
<h1>TECHGEAR</h1>
<p>HARDWARE & ACCESSORIES</p>
</div>
</div>
<a class="volver" href="{% url 'catalogo' %}">← Volver al catálogo</a>
</header>

<main class="contenedor">
<form class="checkout" method="POST">
{% csrf_token %}

<div class="etiqueta">TECHGEAR // ORDER SYSTEM</div>
<h2>Registrar pedido <span>//</span></h2>

{% if mensaje %}
<div class="mensaje">{{ mensaje }}</div>
{% endif %}

<label for="producto_id">ID del producto</label>
<input type="text" id="producto_id" name="producto_id" required>

<label for="cantidad">Cantidad</label>
<input type="number" id="cantidad" name="cantidad" min="1" required>

<label for="cliente">Cliente</label>
<input type="text" id="cliente" name="cliente" required>

<button class="boton" type="submit">Realizar pedido</button>
</form>
</main>

</body>
</html>
